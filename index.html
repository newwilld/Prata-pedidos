<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prata Embalagens - Gerenciador de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Kanban Drag & Drop Styles */
        .kanban-column {
            min-height: 200px;
        }
        .draggable-card {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .draggable-card:active {
            cursor: grabbing;
            transform: scale(0.98);
        }
        .dragging {
            opacity: 0.5;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .drag-over {
            background-color: #e5e7eb;
            border: 2px dashed #9ca3af;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Modal Base para Edição -->
    <div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-40 fade-in p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-bold text-gray-900 mb-4 flex justify-between items-center">
                Editar Pedido
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </h3>
            <div id="editModalContent" class="space-y-4">
                <!-- Preenchido via JS -->
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="saveOrderEdit()" class="flex-1 bg-gray-900 text-white py-2 rounded-lg font-medium hover:bg-gray-800 transition">Salvar</button>
                <button onclick="closeEditModal()" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg font-medium hover:bg-gray-300 transition">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="authScreen" class="flex-1 flex items-center justify-center p-4 min-h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gray-900 text-white rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">
                    <i class="fas fa-box-open"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Prata Embalagens</h1>
                <p class="text-gray-500 mt-1 text-sm" id="authSubtitle">Acesse sua conta para continuar</p>
            </div>

            <form id="authForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="authEmail" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition bg-gray-50 focus:bg-white" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="authPassword" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition bg-gray-50 focus:bg-white" placeholder="••••••••">
                </div>
                
                <div id="registerFields" class="hidden space-y-5 fade-in">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                        <input type="text" id="authName" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition bg-gray-50 focus:bg-white" placeholder="Seu nome">
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-gray-900 text-white font-medium py-3 rounded-lg hover:bg-gray-800 transition shadow-lg shadow-gray-900/20">
                    Entrar
                </button>
            </form>

            <div class="mt-6 text-center">
                <button type="button" id="toggleAuthBtn" class="text-sm text-gray-600 hover:text-gray-900 font-medium transition">
                    Não tem conta? Criar agora
                </button>
            </div>
        </div>
    </div>

    <div id="appScreen" class="hidden flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-900 text-white rounded-lg flex items-center justify-center shadow">
                        <i class="fas fa-box-open"></i>
                    </div>
                    <span class="font-bold text-lg text-gray-900 hidden sm:block">Prata Embalagens</span>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p id="headerUserName" class="text-sm font-medium text-gray-900"></p>
                        <p id="headerUserRole" class="text-xs text-gray-500"></p>
                    </div>
                    <button onclick="logout()" class="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="Sair">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
            
            <!-- Visão do Cliente -->
            <div id="clientView" class="hidden space-y-8">
                <!-- Formulário de Novo Pedido -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
                    <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-gray-400"></i> Fazer Novo Pedido
                    </h2>
                    <form id="orderForm" class="space-y-6 max-w-2xl">
                        <!-- Seletor de Produto -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Selecione o Produto</label>
                            <select id="productSelect" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition bg-gray-50">
                                <option value="" disabled selected>Escolha uma opção...</option>
                                <option value="Caixa de Pizza">Caixa de Pizza</option>
                                <option value="Caixa de Bolo">Caixa de Bolo</option>
                                <option value="Caixa de Torta">Caixa de Torta</option>
                                <option value="Caixa para Ecommerce">Caixa para Ecommerce</option>
                            </select>
                        </div>

                        <!-- Seletor de Quantidade (Cascata) -->
                        <div id="quantityContainer" class="hidden fade-in">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Quantidade</label>
                            <select id="quantitySelect" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition bg-gray-50">
                                <option value="" disabled selected>Escolha a quantidade...</option>
                                <option value="500">500 unidades</option>
                                <option value="1000">1.000 unidades</option>
                                <option value="2000">2.000 unidades</option>
                                <option value="3000">3.000 unidades</option>
                                <option value="4000">4.000 unidades</option>
                                <option value="5000">5.000 unidades</option>
                                <option value="Outra">Outra quantidade (digitar)</option>
                            </select>
                        </div>

                        <!-- Campo de Quantidade Customizada -->
                        <div id="customQuantityContainer" class="hidden fade-in">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Digite a Quantidade Específica</label>
                            <input type="number" id="customQuantityInput" min="1" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-gray-900 outline-none transition bg-gray-50" placeholder="Ex: 1500">
                        </div>

                        <!-- Prioridade -->
                        <div class="fade-in">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Prioridade</label>
                            <div class="flex gap-4">
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="priority" value="Baixa" class="peer sr-only" checked>
                                    <div class="text-center py-2 px-4 rounded-xl border border-gray-200 peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 transition">Baixa</div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="priority" value="Média" class="peer sr-only">
                                    <div class="text-center py-2 px-4 rounded-xl border border-gray-200 peer-checked:bg-yellow-50 peer-checked:border-yellow-500 peer-checked:text-yellow-700 transition">Média</div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="priority" value="Alta" class="peer sr-only">
                                    <div class="text-center py-2 px-4 rounded-xl border border-gray-200 peer-checked:bg-red-50 peer-checked:border-red-500 peer-checked:text-red-700 transition">Alta</div>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-gray-900 text-white font-medium py-3.5 rounded-xl hover:bg-gray-800 transition shadow-lg shadow-gray-900/20 flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i> Enviar Pedido
                        </button>
                    </form>
                </div>

                <!-- Meus Pedidos -->
                <div>
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Meus Pedidos Recentes</h3>
                    <div id="clientOrdersList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                        <!-- Preenchido via JS -->
                    </div>
                </div>
            </div>

            <!-- Visão do Admin -->
            <div id="adminView" class="hidden space-y-6">
                <!-- Abas -->
                <div class="flex border-b border-gray-200">
                    <button onclick="switchAdminTab('pedidos')" id="tabPedidos" class="px-6 py-3 font-medium text-sm text-gray-900 border-b-2 border-gray-900">
                        <i class="fas fa-tasks mr-2"></i> Pedidos (Kanban)
                    </button>
                    <button onclick="switchAdminTab('clientes')" id="tabClientes" class="px-6 py-3 font-medium text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition">
                        <i class="fas fa-users mr-2"></i> Clientes
                    </button>
                </div>

                <!-- Aba Pedidos (Kanban) -->
                <div id="adminTabPedidos" class="fade-in overflow-x-auto pb-4">
                    <div class="flex flex-col md:flex-row gap-6 min-w-max md:min-w-0">
                        
                        <!-- Coluna: Pendente -->
                        <div class="flex-1 bg-gray-100 rounded-xl p-4 flex flex-col min-w-[300px]">
                            <h3 class="font-bold text-gray-700 mb-4 flex items-center justify-between">
                                <span><i class="fas fa-inbox text-gray-400 mr-2"></i> Recebidos</span>
                                <span id="countPendente" class="bg-gray-200 text-gray-600 text-xs px-2 py-1 rounded-full">0</span>
                            </h3>
                            <div id="kanban-pendente" class="kanban-column flex-1 space-y-3" data-status="pendente">
                                <!-- Cards JS -->
                            </div>
                        </div>

                        <!-- Coluna: Em Produção -->
                        <div class="flex-1 bg-blue-50 rounded-xl p-4 flex flex-col min-w-[300px]">
                            <h3 class="font-bold text-blue-800 mb-4 flex items-center justify-between">
                                <span><i class="fas fa-cogs text-blue-400 mr-2"></i> Em Produção</span>
                                <span id="countProducao" class="bg-blue-200 text-blue-800 text-xs px-2 py-1 rounded-full">0</span>
                            </h3>
                            <div id="kanban-producao" class="kanban-column flex-1 space-y-3" data-status="producao">
                                <!-- Cards JS -->
                            </div>
                        </div>

                        <!-- Coluna: Finalizado -->
                        <div class="flex-1 bg-green-50 rounded-xl p-4 flex flex-col min-w-[300px]">
                            <h3 class="font-bold text-green-800 mb-4 flex items-center justify-between">
                                <span><i class="fas fa-check-circle text-green-400 mr-2"></i> Finalizados</span>
                                <span id="countFinalizado" class="bg-green-200 text-green-800 text-xs px-2 py-1 rounded-full">0</span>
                            </h3>
                            <div id="kanban-finalizado" class="kanban-column flex-1 space-y-3" data-status="finalizado">
                                <!-- Cards JS -->
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Aba Clientes -->
                <div id="adminTabClientes" class="hidden fade-in">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-gray-50 border-b border-gray-200 text-gray-600">
                                    <tr>
                                        <th class="px-6 py-4 font-medium">Nome do Cliente</th>
                                        <th class="px-6 py-4 font-medium">Total de Pedidos</th>
                                        <th class="px-6 py-4 font-medium">Último Pedido</th>
                                        <th class="px-6 py-4 font-medium">Status da Conta</th>
                                    </tr>
                                </thead>
                                <tbody id="clientsTableBody" class="divide-y divide-gray-100">
                                    <!-- JS Content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração segura do Firebase via Environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'prata-embalagens-app';
        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                apiKey: "mock-key", authDomain: "mock.firebaseapp.com", projectId: "mock-project"
            };
        } catch (e) { console.error("Erro no config do firebase", e); }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Estado Global
        let currentUser = null;
        let isRegistering = false;
        let allOrders = [];
        let allUsers = [];
        let editingOrderId = null;
        let unsubscribeOrders = null;
        let unsubscribeUsers = null;

        // Caminhos Restritos Firestore (Regra 1)
        const usersCollection = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const ordersCollection = collection(db, 'artifacts', appId, 'public', 'data', 'orders');

        function showToast(title, message, type = 'info') {
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-gray-900';
            toast.className = `${bg} text-white px-6 py-4 rounded-xl shadow-xl fade-in flex flex-col gap-1 min-w-[300px] border border-white/10`;
            toast.innerHTML = `<strong class="font-bold">${title}</strong><span class="text-sm opacity-90">${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function formatDateTime(isoString) {
            if(!isoString) return 'N/A';
            const d = new Date(isoString);
            return `${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`;
        }

        window.onload = async () => {
            try {
                // Regra 3: Auth Before Queries
                await signInAnonymously(auth);
                checkSession();
                setupEventListeners();
            } catch (error) {
                console.error("Erro na auth inicial:", error);
                showToast("Erro", "Falha de conexão. Tente recarregar a página.", "error");
            }
        };

        function checkSession() {
            const saved = sessionStorage.getItem('prataUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                
                // Trava de segurança extra no carregamento da sessão
                if(currentUser.email === 'lojavirtualprata@gmail.com') {
                    currentUser.role = 'admin';
                }

                showApp();
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.add('flex');
            
            if(unsubscribeOrders) unsubscribeOrders();
            if(unsubscribeUsers) unsubscribeUsers();
        }

        function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('flex');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('flex');

            document.getElementById('headerUserName').textContent = currentUser.name;
            document.getElementById('headerUserRole').textContent = currentUser.role === 'admin' ? 'Administrador Master' : 'Cliente';

            if (currentUser.role === 'admin') {
                document.getElementById('adminView').classList.remove('hidden');
                document.getElementById('clientView').classList.add('hidden');
                initAdminData();
            } else {
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('clientView').classList.remove('hidden');
                initClientData();
            }
        }

        window.logout = () => {
            currentUser = null;
            sessionStorage.removeItem('prataUser');
            showAuth();
            showToast("Sucesso", "Logout realizado com sucesso.", "success");
        };

        const authForm = document.getElementById('authForm');
        const toggleAuthBtn = document.getElementById('toggleAuthBtn');
        const registerFields = document.getElementById('registerFields');

        toggleAuthBtn.addEventListener('click', () => {
            isRegistering = !isRegistering;
            if (isRegistering) {
                registerFields.classList.remove('hidden');
                document.getElementById('authSubmitBtn').textContent = 'Criar Conta';
                document.getElementById('authSubtitle').textContent = 'Crie sua conta para fazer pedidos';
                toggleAuthBtn.textContent = 'Já tem conta? Entrar';
                document.getElementById('authName').setAttribute('required', 'true');
            } else {
                registerFields.classList.add('hidden');
                document.getElementById('authSubmitBtn').textContent = 'Entrar';
                document.getElementById('authSubtitle').textContent = 'Acesse sua conta para continuar';
                toggleAuthBtn.textContent = 'Não tem conta? Criar agora';
                document.getElementById('authName').removeAttribute('required');
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim().toLowerCase();
            const password = document.getElementById('authPassword').value;
            const userDocId = email.replace(/[^a-zA-Z0-9]/g, '_'); // Simples ID baseado em email

            if(!auth.currentUser) return showToast("Aguarde", "Conectando ao servidor...", "info");

            const docRef = doc(usersCollection, userDocId);
            
            try {
                if (isRegistering) {
                    const name = document.getElementById('authName').value.trim();
                    if(!name) return showToast("Atenção", "Preencha seu nome.", "error");

                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) return showToast("Erro", "E-mail já registrado.", "error");

                    // REGRA DE OURO: Apenas este e-mail vira Admin. O resto é client.
                    const role = email === 'lojavirtualprata@gmail.com' ? 'admin' : 'client';

                    const userData = { email, password, name, role, createdAt: new Date().toISOString() };
                    await setDoc(docRef, userData);
                    
                    currentUser = { id: userDocId, ...userData };
                    sessionStorage.setItem('prataUser', JSON.stringify(currentUser));
                    showToast("Sucesso", "Conta criada!", "success");
                    showApp();

                } else {
                    const docSnap = await getDoc(docRef);
                    if (!docSnap.exists() || docSnap.data().password !== password) {
                        return showToast("Erro", "Credenciais inválidas.", "error");
                    }
                    
                    let userData = docSnap.data();
                    
                    // Trava de segurança redundante no login
                    if(userData.email === 'lojavirtualprata@gmail.com' && userData.role !== 'admin') {
                        userData.role = 'admin'; 
                        await updateDoc(docRef, { role: 'admin' }); // Força atualização no banco se necessário
                    }

                    currentUser = { id: userDocId, ...userData };
                    sessionStorage.setItem('prataUser', JSON.stringify(currentUser));
                    showApp();
                }
            } catch (error) {
                console.error("Auth error:", error);
                showToast("Erro", "Houve um problema de comunicação com o servidor.", "error");
            }
        });

        function setupEventListeners() {
            const productSelect = document.getElementById('productSelect');
            const quantityContainer = document.getElementById('quantityContainer');
            const quantitySelect = document.getElementById('quantitySelect');
            const customQuantityContainer = document.getElementById('customQuantityContainer');
            const customQuantityInput = document.getElementById('customQuantityInput');

            productSelect.addEventListener('change', (e) => {
                if(e.target.value) {
                    quantityContainer.classList.remove('hidden');
                    quantitySelect.setAttribute('required', 'true');
                }
            });

            quantitySelect.addEventListener('change', (e) => {
                if(e.target.value === 'Outra') {
                    customQuantityContainer.classList.remove('hidden');
                    customQuantityInput.setAttribute('required', 'true');
                } else {
                    customQuantityContainer.classList.add('hidden');
                    customQuantityInput.removeAttribute('required');
                }
            });

            document.getElementById('orderForm').addEventListener('submit', handleOrderSubmit);
        }

        async function handleOrderSubmit(e) {
            e.preventDefault();
            if(!auth.currentUser) return;

            const product = document.getElementById('productSelect').value;
            let quantity = document.getElementById('quantitySelect').value;
            if(quantity === 'Outra') {
                quantity = document.getElementById('customQuantityInput').value + ' unidades';
            } else {
                quantity = quantity + ' unidades';
            }
            const priority = document.querySelector('input[name="priority"]:checked').value;

            const newOrder = {
                clientId: currentUser.id,
                clientName: currentUser.name,
                product,
                quantity,
                priority,
                status: 'pendente', // pendente, producao, finalizado
                orderIndex: Date.now(), // Para ordenação kanban
                createdAt: new Date().toISOString()
            };

            try {
                const btn = e.target.querySelector('button[type="submit"]');
                const origText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
                btn.disabled = true;

                await addDoc(ordersCollection, newOrder);
                
                showToast("Sucesso", "Pedido enviado com sucesso!", "success");
                e.target.reset();
                document.getElementById('quantityContainer').classList.add('hidden');
                document.getElementById('customQuantityContainer').classList.add('hidden');
                
                btn.innerHTML = origText;
                btn.disabled = false;
            } catch (error) {
                console.error("Erro ao salvar pedido:", error);
                showToast("Erro", "Não foi possível enviar o pedido.", "error");
            }
        }

        function initClientData() {
            unsubscribeOrders = onSnapshot(ordersCollection, (snapshot) => {
                const orders = [];
                snapshot.forEach(doc => orders.push({id: doc.id, ...doc.data()}));
                // Filtra em memória para o cliente atual
                const myOrders = orders.filter(o => o.clientId === currentUser.id)
                                       .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderClientOrders(myOrders);
            }, (error) => { console.error(error); showToast("Erro", "Falha ao carregar pedidos.", "error"); });
        }

        function initAdminData() {
            unsubscribeOrders = onSnapshot(ordersCollection, (snapshot) => {
                allOrders = [];
                snapshot.forEach(doc => allOrders.push({id: doc.id, ...doc.data()}));
                renderKanban();
                renderClientsList(); // Atualiza lista de clientes caso haja pedidos novos
            }, (error) => console.error(error));

            unsubscribeUsers = onSnapshot(usersCollection, (snapshot) => {
                allUsers = [];
                snapshot.forEach(doc => allUsers.push({id: doc.id, ...doc.data()}));
                renderClientsList();
            }, (error) => console.error(error));
        }

        function renderClientOrders(orders) {
            const container = document.getElementById('clientOrdersList');
            if (orders.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-300">Você ainda não tem pedidos.</div>`;
                return;
            }

            container.innerHTML = orders.map(order => {
                const statusColors = {
                    'pendente': 'bg-gray-100 text-gray-700 border-gray-200',
                    'producao': 'bg-blue-100 text-blue-700 border-blue-200',
                    'finalizado': 'bg-green-100 text-green-700 border-green-200'
                };
                const statusText = {
                    'pendente': 'Aguardando',
                    'producao': 'Em Produção',
                    'finalizado': 'Finalizado'
                };
                const priorityIcons = {
                    'Baixa': '<i class="fas fa-arrow-down text-blue-500"></i>',
                    'Média': '<i class="fas fa-minus text-yellow-500"></i>',
                    'Alta': '<i class="fas fa-arrow-up text-red-500"></i>'
                };

                return `
                <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-col gap-3 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full ${order.status === 'finalizado' ? 'bg-green-500' : order.status === 'producao' ? 'bg-blue-500' : 'bg-gray-400'}"></div>
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">${formatDateTime(order.createdAt).split(' às')[0]}</span>
                            <h4 class="font-bold text-gray-900 leading-tight mt-1">${order.product}</h4>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-md font-medium border ${statusColors[order.status]}">
                            ${statusText[order.status]}
                        </span>
                    </div>
                    <div class="text-sm text-gray-600 flex items-center gap-2">
                        <i class="fas fa-cubes text-gray-400"></i> ${order.quantity}
                    </div>
                    <div class="text-sm text-gray-600 flex items-center gap-2">
                        ${priorityIcons[order.priority]} Prioridade ${order.priority}
                    </div>
                </div>`;
            }).join('');
        }

        window.switchAdminTab = (tab) => {
            if(tab === 'pedidos') {
                document.getElementById('adminTabPedidos').classList.remove('hidden');
                document.getElementById('adminTabClientes').classList.add('hidden');
                document.getElementById('tabPedidos').className = "px-6 py-3 font-medium text-sm text-gray-900 border-b-2 border-gray-900 transition";
                document.getElementById('tabClientes').className = "px-6 py-3 font-medium text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition";
            } else {
                document.getElementById('adminTabPedidos').classList.add('hidden');
                document.getElementById('adminTabClientes').classList.remove('hidden');
                document.getElementById('tabPedidos').className = "px-6 py-3 font-medium text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition";
                document.getElementById('tabClientes').className = "px-6 py-3 font-medium text-sm text-gray-900 border-b-2 border-gray-900 transition";
            }
        };

        function renderKanban() {
            const cols = {
                'pendente': document.getElementById('kanban-pendente'),
                'producao': document.getElementById('kanban-producao'),
                'finalizado': document.getElementById('kanban-finalizado')
            };

            // Limpa as colunas
            Object.values(cols).forEach(col => col.innerHTML = '');

            const counts = { 'pendente': 0, 'producao': 0, 'finalizado': 0 };

            // Ordena pela propriedade orderIndex ascendente
            const sortedOrders = [...allOrders].sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));

            sortedOrders.forEach(order => {
                if(!cols[order.status]) return; // Fallback
                
                counts[order.status]++;
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow-sm border border-gray-200 draggable-card flex flex-col gap-2";
                card.setAttribute('draggable', 'true');
                card.setAttribute('data-id', order.id);
                
                const priorityColor = order.priority === 'Alta' ? 'text-red-600 bg-red-50' : order.priority === 'Média' ? 'text-yellow-600 bg-yellow-50' : 'text-blue-600 bg-blue-50';

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <button onclick="openEditModal('${order.id}')" class="font-bold text-gray-900 hover:text-blue-600 transition text-left underline decoration-dotted decoration-gray-400">
                            ${order.clientName}
                        </button>
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${priorityColor}">${order.priority}</span>
                    </div>
                    <div class="text-sm text-gray-700 font-medium">${order.product}</div>
                    <div class="text-xs text-gray-500">${order.quantity}</div>
                    <div class="text-xs text-gray-400 mt-2 flex justify-between items-center border-t border-gray-50 pt-2">
                        <span>${formatDateTime(order.createdAt).split(' às')[0]}</span>
                        <i class="fas fa-grip-lines text-gray-300"></i>
                    </div>
                `;

                // Eventos de Drag & Drop
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);

                cols[order.status].appendChild(card);
            });

            document.getElementById('countPendente').textContent = counts.pendente;
            document.getElementById('countProducao').textContent = counts.producao;
            document.getElementById('countFinalizado').textContent = counts.finalizado;

            setupDragAndDrop();
        }

        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            setTimeout(() => this.classList.add('hidden'), 0); // Hide original
        }

        function handleDragEnd(e) {
            this.classList.remove('hidden');
            draggedItem = null;
        }

        function setupDragAndDrop() {
            const columns = document.querySelectorAll('.kanban-column');
            
            columns.forEach(col => {
                col.addEventListener('dragover', e => {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(col, e.clientY);
                    const draggable = draggedItem;
                    if (draggable) {
                        if (afterElement == null) {
                            col.appendChild(draggable);
                        } else {
                            col.insertBefore(draggable, afterElement);
                        }
                    }
                });

                col.addEventListener('drop', async e => {
                    e.preventDefault();
                    if(!draggedItem) return;
                    
                    const orderId = draggedItem.getAttribute('data-id');
                    const newStatus = col.getAttribute('data-status');
                    
                    // Reordenar os index visuais baseados no DOM atual
                    const cardsInColumn = [...col.querySelectorAll('.draggable-card')];
                    const updates = [];

                    // Atualiza o card arrastado primeiro
                    updates.push(updateDoc(doc(ordersCollection, orderId), { 
                        status: newStatus 
                    }));

                    // Atualiza a prioridade/ordem de todos na coluna se necessário
                    // Simplificação: vamos atualizar o orderIndex apenas para manter a ordem visual
                    cardsInColumn.forEach((cardEl, index) => {
                        const cId = cardEl.getAttribute('data-id');
                        updates.push(updateDoc(doc(ordersCollection, cId), { orderIndex: index }));
                    });

                    try {
                        await Promise.all(updates);
                    } catch(err) {
                        console.error("Erro ao reordenar", err);
                        showToast("Erro", "Falha ao salvar a nova ordem.", "error");
                    }
                });
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.draggable-card:not(.hidden)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        window.openEditModal = (orderId) => {
            const order = allOrders.find(o => o.id === orderId);
            if(!order) return;
            editingOrderId = orderId;

            const content = document.getElementById('editModalContent');
            content.innerHTML = `
                <div class="mb-2 text-sm text-gray-500">Cliente: <strong class="text-gray-900">${order.clientName}</strong></div>
                <div class="mb-4 text-sm text-gray-500">Produto: <strong class="text-gray-900">${order.product} - ${order.quantity}</strong></div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="editStatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:border-gray-900">
                        <option value="pendente" ${order.status==='pendente'?'selected':''}>Pendente (Recebidos)</option>
                        <option value="producao" ${order.status==='producao'?'selected':''}>Em Produção</option>
                        <option value="finalizado" ${order.status==='finalizado'?'selected':''}>Finalizado</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
                    <select id="editPriority" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:border-gray-900">
                        <option value="Baixa" ${order.priority==='Baixa'?'selected':''}>Baixa</option>
                        <option value="Média" ${order.priority==='Média'?'selected':''}>Média</option>
                        <option value="Alta" ${order.priority==='Alta'?'selected':''}>Alta</option>
                    </select>
                </div>
                <div class="mt-4 pt-4 border-t border-gray-100">
                     <button onclick="deleteOrder('${order.id}')" class="text-sm text-red-600 hover:text-red-800 font-medium flex items-center gap-2">
                        <i class="fas fa-trash"></i> Excluir Pedido
                     </button>
                </div>
            `;
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        };

        window.closeEditModal = () => {
            editingOrderId = null;
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
        };

        window.saveOrderEdit = async () => {
            if(!editingOrderId) return;
            const newStatus = document.getElementById('editStatus').value;
            const newPriority = document.getElementById('editPriority').value;

            try {
                await updateDoc(doc(ordersCollection, editingOrderId), {
                    status: newStatus,
                    priority: newPriority
                });
                showToast("Sucesso", "Pedido atualizado.", "success");
                closeEditModal();
            } catch (error) {
                console.error(error);
                showToast("Erro", "Falha ao atualizar.", "error");
            }
        };

        window.deleteOrder = async (id) => {
            // Em vez de alert/confirm usamos lógica direta, mas num app real teria modal de confirmação.
            // Para cumprir a regra de não usar alert/confirm, excluímos direto após clique (que já está dentro de um modal).
            try {
                await deleteDoc(doc(ordersCollection, id));
                showToast("Excluído", "O pedido foi deletado permanentemente.", "info");
                closeEditModal();
            } catch(e) {
                showToast("Erro", "Falha ao excluir.", "error");
            }
        };

        function renderClientsList() {
            const tbody = document.getElementById('clientsTableBody');
            
            // Agrupar pedidos por cliente
            const clientStats = {};
            allOrders.forEach(order => {
                if(!clientStats[order.clientId]) {
                    clientStats[order.clientId] = { total: 0, lastOrderDate: order.createdAt };
                }
                clientStats[order.clientId].total++;
                if(new Date(order.createdAt) > new Date(clientStats[order.clientId].lastOrderDate)) {
                    clientStats[order.clientId].lastOrderDate = order.createdAt;
                }
            });

            // Gerar tabela juntando usuários (clientes) e seus stats
            const clientsHTML = allUsers.filter(u => u.role === 'client').map(client => {
                const stats = clientStats[client.id] || { total: 0, lastOrderDate: null };
                
                return `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">${client.name}</div>
                        <div class="text-xs text-gray-500">${client.email}</div>
                    </td>
                    <td class="px-6 py-4 text-gray-700">
                        <span class="bg-gray-100 px-2.5 py-1 rounded-md text-xs font-bold">${stats.total}</span>
                    </td>
                    <td class="px-6 py-4 text-gray-500 text-sm">
                        ${stats.lastOrderDate ? formatDateTime(stats.lastOrderDate).split(' às')[0] : 'Nunca comprou'}
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-green-50 text-green-700 border border-green-200">
                            <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Ativo
                        </span>
                    </td>
                </tr>
                `;
            }).join('');

            tbody.innerHTML = clientsHTML || `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Nenhum cliente registrado ainda.</td></tr>`;
        }
    </script>
</body>
</html>
